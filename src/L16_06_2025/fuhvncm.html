<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/html">
<style>
body {
font-family: sans-serif;
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
background-color: #eee;
}

.user-card {
position: relative;
width: 350px;
border: 1px solid #ccc;
border-radius: 5px;
padding: 20px;
background-color: #f9f9f9;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
display: flex;
flex-direction: column;
align-items: center;
}

.avatar {
width: 80px;
height: 80px;
border-radius: 50%;
float: left;
margin-right: 15px;
}

h2 {
font-size: 24px;
text-align: center;
margin-bottom: 10px;
width: 100%; /* Занимает всю ширину контейнера */
}

.info {
display: flex;
flex-direction: column; /*  Организуем элементы в столбец */
margin-bottom: 10px;
padding: 10px;
background-color: #f0f0f0;
border-radius: 3px;
}

.info p {
font-size: 14px;
margin: 5px 0;
text-align: left;
}

.description {
clear: both; /*  Отменяем обтекание для корректного отображения под аватаром */
margin-bottom: 15px;
text-align: left;
}

.buttons {
display: flex;
justify-content: space-around;
width: 100%;
}

button {
background-color: #4CAF50;
color: white;
padding: 10px 15px;
border: none;
border-radius: 5px;
cursor: pointer;
font-size: 14px;
transition: background-color 0.3s;
}

button:hover {
background-color: #367c39;
}

.star {
position: absolute;
top: 10px;
right: 10px;
font-size: 20px;
color: gold;
opacity: 0.7;
transition: transform 0.2s ease-in-out;
cursor: pointer;
}

.star:hover {
transform: scale(1.2);
}

/* Адаптивность */
@media (max-width: 400px) {
.user-card {
width: 100%;
padding: 10px;
}

.avatar {
float: none;
display: block;
margin: 0 auto;
}

.info {
flex-direction: column; /* Перестраиваем в колонку на маленьких экранах */
}

.star {
font-size: 15px;
}

.description {
text-align: center; /* Центрируем описание на маленьких экранах */
}
}
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка профиля пользователя</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<article class="user-card">
    <div class="star">⭐</div>
    <img src="avatar.jpg" alt="Аватар пользователя" class="avatar">
    <h2>Анна Иванова</h2>
    <div class="info">
        <p>Возраст: 25 лет</p>
        <p><a href="mailto:anna@example.com">Email: anna@example.com</a></p>
        <p>Адрес: Минск, ул. Ленина, 10</p>
        <p>Хобби: <a href="#">программирование</a>, <a href="#">путешествия</a></p>
    </div>
    <p class="description">
        Привет! Я начинающий веб-разработчик, люблю путешествовать и узнавать новое.
    </p>
    <div class="buttons">
        <button class="contact">Связаться</button>
        <button class="edit">Редактировать</button>
    </div>
</article>

</body>
</html>
