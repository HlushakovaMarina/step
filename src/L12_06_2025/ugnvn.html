<!DOCTYPE html>
<html lang="ru">
<style>
    body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f0f0;
    }
    .form {
    width: 400px;
    margin: auto;
    background-color: #f5f5f5;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
    }
    label {
    display: block;
    margin-bottom: 10px;
    font-size: 14px;
    color: black;
    }
    .input {
    width: 100%;1
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
    font-size: 16px;
    }
    .input:focus {
    outline: none;
    border-color: blue;
    box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
    }
    .btn {
    background-color: #4CAF50;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s;
    display: block;
    margin: 20px auto 0; /* Center the button */
    width: 400px; /* Make the button fit its content */
    }
    .btn:hover {
    background-color: #45a049;
    }
    dialog {
    background-color: white;
    border: 1px solid #ccc;
    padding: 20px;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    }
    dialog::backdrop {
    background-color: rgba(0, 0, 0, 0.5);
    }
    dialog button {
    background-color: #f44336;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
    }
    dialog button:hover {
    background-color: #da190b;
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<form action="/register" method="post" class="form">
    <h2>Регистрация</h2>

    <label for="name">Имя:</label>
    <input type="text" id="name" name="name" placeholder="Ваше имя" required class="input">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Ваш email" required class="input">

    <label for="password">Пароль:</label>
    <input type="password" id="password" name="password" placeholder="Ваш пароль" required class="input">

    <p>Пол:</p>
    <label>
        <input type="radio" name="gender" value="male" checked> Мужской
        <input type="radio" name="gender" value="female"> Женский
    </label>

    <p>Интересы:</p>
    <label>
        <input type="checkbox" name="interests" value="music"> Музыка
        <input type="checkbox" name="interests" value="sports"> Спорт
        <input type="checkbox" name="interests" value="reading"> Чтение
    </label>

    <label for="country">Страна:</label>
    <select id="country" name="country" class="input">
        <option value="belarus" selected>Беларусь</option>
        <option value="usa">США</option>
        <option value="russia">Россия</option>
    </select>

    <button type="submit" class="btn">Зарегистрироваться</button>
</form>

<dialog id="successDialog" open>
    <p>Регистрация успешна!</p>
    <button type="button" onclick="this.parentElement.close()">Закрыть</button>
</dialog>
</body>
</html>
